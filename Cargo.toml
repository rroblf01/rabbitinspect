[package]
name = "rabbitinspect"
version = "2.0.0"
edition = "2021"
description = "Python performance toolkit — static perf/correctness lints plus a sampling runtime profiler (PyO3 extension)"
license = "MIT"
repository = "https://github.com/rroblf01/rabbitinspect"
publish = false

[lib]
name = "rabbitinspect"
# rlib so `cargo test` can run the crate's own unit tests (the attach reader).
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
rustpython-parser = "0.4.0"
rustpython-ast = "0.4.0"
rustc-hash = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
