[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rabbitinspect"
version = "0.1.0"
description = "Python code performance analyzer written in Rust — detects unused variables, None comparisons, list vs generator, and more"
readme = "README.md"
authors = [
    { name = "Ricardo Robles", email = "ricardo.r.f@hotmail.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    'tomli; python_version < "3.11"',
]

[project.scripts]
rabbitinspect = "rabbitinspect.__main__:main"

[project.urls]
Homepage = "https://github.com/ricardorobles/rabbitinspect"
Repository = "https://github.com/ricardorobles/rabbitinspect"
Changelog = "https://github.com/ricardorobles/rabbitinspect/blob/main/CHANGELOG.md"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[tool.maturin]
module-name = "rabbitinspect._core"
python-source = "python"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "ty>=0.0.40",
]
